<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictive Maintenance Console</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border: none; shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 12px; }
        .header-blue { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 40px 0; margin-bottom: 30px; }
        .form-label { font-weight: 600; color: #34495e; }
        .btn-predict { background-color: #1abc9c; border: none; padding: 12px 30px; font-size: 1.1rem; transition: 0.3s; }
        .btn-predict:hover { background-color: #16a085; transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="header-blue text-center">
    <h1>Industrial Digital Twin</h1>
    <p>Advanced Failure Prediction System</p>
</div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-5 shadow-lg">
                <h3 class="mb-4 text-center">Machine Parameters Input</h3>
                <form action="/predict" method="POST">

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Machine Type</label>
                            <select name="type" class="form-select">
                                <option value="L">Low Quality (L)</option>
                                <option value="M">Medium Quality (M)</option>
                                <option value="H">High Quality (H)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Rotational Speed (RPM)</label>
                            <input type="number" name="rot_speed" class="form-control" value="1500" required>
                            <small class="text-muted">Typical: 1168 - 2886 RPM</small>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Torque (Nm)</label>
                            <input type="number" step="0.1" name="torque" class="form-control" value="40.0" required>
                            <small class="text-muted">Typical: 3.8 - 76.6 Nm</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Tool Wear (min)</label>
                            <input type="number" name="tool_wear" class="form-control" value="0" required>
                            <small class="text-muted">Replacement required at ~200 min</small>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Air Temperature (K)</label>
                            <input type="number" step="0.1" name="air_temp" class="form-control" value="300.0" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Process Temperature (K)</label>
                            <input type="number" step="0.1" name="process_temp" class="form-control" value="310.0" required>
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-primary btn-predict w-100">Analyze System Health</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
